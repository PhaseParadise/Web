<meta name="twitter:title" data-i18n-content="meta.ogTitle" content="PhaseParadise. Know without asking.">
<meta name="twitter:description" data-i18n-content="meta.ogDescription" content="Understand her cycle, and show up the right way on the right day.">

<!-- ══════════════════════════════════════════════════════════ NAV -->
<header class="nav" id="nav">
  <div class="nav__inner">

      <img class="nav__logo nav__logo--light" src="images/logo/logo_lightMode.png" data-i18n-alt="nav.logoAlt" alt="PhaseParadise" width="1991" height="334">

    <div class="nav__end">

<main>

<!-- ══════════════════════════════════════════════════════════ 1 · HERO -->
<section class="hero" id="hero">
  <div class="hero__glow" aria-hidden="true"></div>

  <div class="wrap hero__copy">
    <p class="eyebrow hero__eyebrow" data-i18n="hero.eyebrow"></p>
    <h1 class="hero__title">
      <span class="hero__line" data-i18n-rich="hero.titleLine1"></span>
      <span class="hero__line" data-i18n-rich="hero.titleLine2"></span>
    </h1>
    <p class="lede hero__lede" data-i18n="hero.lede"></p>
    <div class="hero__cta">
      <!-- TODO: replace href with the live App Store listing -->
      <a class="badge" href="#" data-i18n-aria="nav.appStore">
        <img src="images/badges/app-store.svg" data-i18n-alt="nav.appStoreAlt" alt="Download on the App Store" width="180" height="60">
      </a>
    </div>
  </div>

  <div class="hero__stage">
    <div class="device device--hero" data-parallax="0.11">
      <div class="device__frame">
        <div class="device__screen">
          <!-- SWAP: today screen -->
          <img src="images/mock/home_1.png" data-i18n-alt="hero.shotAlt" alt="" width="1206" height="2622">
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ══════════════════════════════════════════════════════════ 2 · BENEFITS -->
<section class="benefits" id="benefits">

  <article class="beat wrap" data-reveal>
    <div class="beat__text">
      <h2 class="beat__title" data-i18n-rich="benefits.one.title"></h2>
      <p class="lede" data-i18n="benefits.one.lede"></p>
    </div>
    <div class="beat__visual">
      <div class="device" data-parallax="0.07">
        <div class="device__frame">
          <div class="device__screen">
            <!-- SWAP: what is shaping her day -->
            <img src="images/mock/home_3.png" data-i18n-alt="benefits.one.shotAlt" alt="" width="1206" height="2622" loading="lazy" decoding="async">
          </div>
        </div>
      </div>
    </div>
  </article>

  <article class="beat beat--flip wrap" data-reveal>
    <div class="beat__text">
      <h2 class="beat__title" data-i18n-rich="benefits.two.title"></h2>
      <p class="lede" data-i18n="benefits.two.lede"></p>
    </div>
    <div class="beat__visual">
      <div class="device" data-parallax="0.07">
        <div class="device__frame">
          <div class="device__screen">
            <!-- SWAP: check-in history -->
            <img src="images/mock/checkin_1.png" data-i18n-alt="benefits.two.shotAlt" alt="" width="1206" height="2622" loading="lazy" decoding="async">
          </div>
        </div>
      </div>
    </div>
  </article>

  <article class="beat wrap" data-reveal>
    <div class="beat__text">
      <h2 class="beat__title" data-i18n-rich="benefits.three.title"></h2>
      <p class="lede" data-i18n="benefits.three.lede"></p>
    </div>
    <div class="beat__visual">
      <div class="device" data-parallax="0.07">
        <div class="device__frame">
          <div class="device__screen">
            <!-- SWAP: five day outlook -->
            <img src="images/mock/home_2.png" data-i18n-alt="benefits.three.shotAlt" alt="" width="1206" height="2622" loading="lazy" decoding="async">
          </div>
        </div>
      </div>
    </div>
  </article>

</section>

<!-- ══════════════════════════════════════════════════════════ 3 · PHASES (signature) -->
<section class="phases" id="phases">
  <div class="phases__track" id="phasesTrack">
    <div class="phases__sticky">
      <div class="wrap phases__grid">

        <div class="phases__intro">
          <p class="eyebrow eyebrow--onDark" data-i18n="phases.eyebrow"></p>
          <h2 class="phases__title" data-i18n-rich="phases.title"></h2>
          <p class="lede lede--onDark" data-i18n="phases.lede"></p>
        </div>

        <div class="ring" id="ring">
          <svg class="ring__svg" viewBox="0 0 300 300" role="img" data-i18n-aria="phases.ringAlt">
            <defs>
              <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="6" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <path class="ring__track" d="M150 24 H189 A87 87 0 0 1 276 111 V189 A87 87 0 0 1 189 276 H111 A87 87 0 0 1 24 189 V111 A87 87 0 0 1 111 24 Z"/>
            <g filter="url(#ringGlow)">
              <path class="ring__arc" data-phase="0" d="M150 24 H189 A87 87 0 0 1 276 111 V189 A87 87 0 0 1 189 276 H111 A87 87 0 0 1 24 189 V111 A87 87 0 0 1 111 24 Z"/>
              <path class="ring__arc" data-phase="1" d="M150 24 H189 A87 87 0 0 1 276 111 V189 A87 87 0 0 1 189 276 H111 A87 87 0 0 1 24 189 V111 A87 87 0 0 1 111 24 Z"/>
              <path class="ring__arc" data-phase="2" d="M150 24 H189 A87 87 0 0 1 276 111 V189 A87 87 0 0 1 189 276 H111 A87 87 0 0 1 24 189 V111 A87 87 0 0 1 111 24 Z"/>
              <path class="ring__arc" data-phase="3" d="M150 24 H189 A87 87 0 0 1 276 111 V189 A87 87 0 0 1 189 276 H111 A87 87 0 0 1 24 189 V111 A87 87 0 0 1 111 24 Z"/>
            </g>
            <circle class="ring__marker" id="ringMarker" cx="150" cy="24" r="9"/>
          </svg>
          <div class="ring__center">
            <span class="ring__day" id="ringDay">1</span>
            <span class="ring__unit"><span data-i18n="phases.dayLabel"></span> / <span id="ringTotal">29</span></span>
          </div>
        </div>

        <ol class="plist" id="plist">
          <li class="plist__item" data-phase="0">
            <span class="plist__name" data-i18n="phases.items.0.name"></span>
            <span class="plist__line" data-i18n="phases.items.0.line"></span>
          </li>
          <li class="plist__item" data-phase="1">
            <span class="plist__name" data-i18n="phases.items.1.name"></span>
            <span class="plist__line" data-i18n="phases.items.1.line"></span>
          </li>
          <li class="plist__item" data-phase="2">
            <span class="plist__name" data-i18n="phases.items.2.name"></span>
            <span class="plist__line" data-i18n="phases.items.2.line"></span>
          </li>
          <li class="plist__item" data-phase="3">
            <span class="plist__name" data-i18n="phases.items.3.name"></span>
            <span class="plist__line" data-i18n="phases.items.3.line"></span>
          </li>
        </ol>

      </div>
    </div>
  </div>
</section>

<!-- ══════════════════════════════════════════════════════════ 4 · INSIGHTS -->
<section class="insights" id="insights">
  <div class="wrap insights__grid">

    <div class="insights__text" data-reveal>
      <p class="eyebrow" data-i18n="insights.eyebrow"></p>
      <h2 class="section__title" data-i18n-rich="insights.title"></h2>
      <p class="lede" data-i18n="insights.lede"></p>
    </div>

    <div class="insights__visual" data-reveal>
      <div class="notif" id="notif">
        <img class="notif__icon" src="images/logo/icon.png" alt="" width="604" height="544" loading="lazy" decoding="async">
        <div class="notif__body">
          <p class="notif__head">
            <span class="notif__app" data-i18n="insights.notification.app"></span>
            <span class="notif__time" data-i18n="insights.notification.time"></span>
          </p>
          <p class="notif__text" data-i18n="insights.notification.text"></p>
        </div>
      </div>
      <div class="device" data-parallax="0.05">
        <div class="device__frame">
          <div class="device__screen">
            <!-- SWAP: reminders -->
            <img src="images/mock/reminders_1.png" data-i18n-alt="insights.shotAlt" alt="" width="1206" height="2622" loading="lazy" decoding="async">

        </div>
      </div>
    </div>

  </div>
</section>

        </div>
      </div>

      <div class="device device--front" data-parallax="0.03">
        <div class="device__frame">
          <div class="device__screen">
            <!-- SWAP: partner page -->
            <img src="images/mock/partner_1.png" data-i18n-alt="partner.ui.alt" alt="" width="1206" height="2622" loading="lazy" decoding="async">

    </div>
